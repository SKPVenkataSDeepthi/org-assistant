<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Org Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f3f5f7; --panel:#fff; --ink:#0f1720; --muted:#5a6b7b; --line:#dde3e9;
    --accent:#0c8a86; --accent-soft:#d3ecea; --user:#0c8a86; --user-ink:#fff; --bot:#eef2f5;
    --chitchat:#0c8a86; --guidance:#2563eb; --assist:#7c3aed; --irrelevant:#b45309;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b1016; --panel:#121a22; --ink:#e7eef4; --muted:#8ea0b0; --line:#243240;
    --accent:#2dd4bf; --accent-soft:#113b39; --user:#0f766e; --user-ink:#eafffb; --bot:#1a2530;
    --chitchat:#2dd4bf; --guidance:#60a5fa; --assist:#a78bfa; --irrelevant:#f59e0b;
    color-scheme:dark;
  }}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;flex:none}
  header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#042b2a;font-weight:700;flex:none}
  h1{font-size:16px;margin:0} h1 small{display:block;font-weight:400;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .spacer{flex:1}
  .hdr-btn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
           font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:9px;
           text-decoration:none;white-space:nowrap}
  .hdr-btn:hover{background:var(--accent);color:#042b2a}
  main{flex:1;overflow-y:auto}
  .chat{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;font-family:var(--mono);font-size:13px}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;margin-bottom:6px;color:#fff}
  .b-chitchat{background:var(--chitchat)} .b-guidance{background:var(--guidance)} .b-assist{background:var(--assist)} .b-irrelevant{background:var(--irrelevant)}
  .linkbtn{display:inline-block;margin-top:10px;background:var(--assist);color:#fff;text-decoration:none;
           font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:8px}
  .linkbtn:hover{opacity:.9}
  .chips{display:flex;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:0 16px 8px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:var(--mono)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
  .bar{max-width:760px;margin:0 auto;display:flex;gap:10px}
  input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:10px;font-family:var(--sans);font-size:14px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{background:var(--accent);color:#042b2a;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .dots::after{content:"…";animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<header><div class="in">
  <div class="logo">🛡️</div>
  <h1>Internal Org Assistant<small>SAST findings · ticket timelines · LLM security report</small></h1>
  <div class="spacer"></div>
  <a id="fullreport" class="hdr-btn" target="_blank" rel="noopener" hidden>📊 Full report ↗</a>
</div></header>

<main><div class="chat" id="chat"></div></main>
<div class="chips" id="chips"></div>

<footer><div class="bar">
  <input id="q" placeholder="Ask about SAST, a ticket timeline, or the report…" autocomplete="off">
  <button id="send">Send</button>
</div></footer>

<script>
const chat=document.getElementById("chat"), input=document.getElementById("q"), sendBtn=document.getElementById("send");
const history=[];
let REPORT_URL="";

// get the live report URL from the backend and show the header button
fetch("/config").then(r=>r.json()).then(c=>{
  REPORT_URL=c.report_url||"";
  const b=document.getElementById("fullreport");
  if(REPORT_URL){ b.href=REPORT_URL; b.hidden=false; }
}).catch(()=>{});

function bubble(role,text,category){
  const el=document.createElement("div");
  el.className="msg "+(role==="user"?"user":"bot");
  if(role==="bot"&&category){
    const b=document.createElement("span"); b.className="badge b-"+category; b.textContent=category;
    el.appendChild(b); el.appendChild(document.createElement("br"));
  }
  el.appendChild(document.createTextNode(text));
  // if this is a report reply, add a button that opens the live full report
  if(role==="bot" && /Live report:/i.test(text)){
    const m=text.match(/Live report:\s*(\S+)/i);
    const url=(m&&m[1])||REPORT_URL;
    if(url){
      const a=document.createElement("a");
      a.className="linkbtn"; a.href=url; a.target="_blank"; a.rel="noopener";
      a.textContent="Open full report ↗";
      el.appendChild(document.createElement("br")); el.appendChild(a);
    }
  }
  chat.appendChild(el); el.scrollIntoView({behavior:"smooth",block:"end"}); return el;
}

async function send(text){
  text=text.trim(); if(!text) return;
  input.value=""; bubble("user",text); history.push({role:"user",content:text}); sendBtn.disabled=true;
  const pending=bubble("bot",""); pending.innerHTML='<span class="dots">thinking</span>';
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history:history.slice(0,-1)})});
    const data=await r.json(); pending.remove();
    bubble("bot",data.reply,data.category); history.push({role:"assistant",content:data.reply});
  }catch(e){ pending.remove(); bubble("bot","Backend error: "+e+"\nIs backend.py running on port 8000?"); }
  finally{ sendBtn.disabled=false; input.focus(); }
}

sendBtn.onclick=()=>send(input.value);
input.addEventListener("keydown",e=>{if(e.key==="Enter")send(input.value);});
["hi","what is a SAST finding","show critical SAST findings","timeline for SEC-142","show the entire security report"]
  .forEach(t=>{const c=document.createElement("div");c.className="chip";c.textContent=t;c.onclick=()=>send(t);document.getElementById("chips").appendChild(c);});
bubble("bot","Hi! I help with SAST findings, security ticket timelines, and the LLM security report. Try a chip below.","chitchat");
</script>
</body>
</html>
